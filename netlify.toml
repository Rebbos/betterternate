# Netlify deploy (vercel.json is kept for Vercel; keep headers in sync between the two).
[build]
  # NETLIFY DEPLOYMENTS ARE OFF: Vercel is the live host. An ignore command that exits 0
  # cancels every Netlify build (production, previews, branch deploys), so nothing deploys
  # and no credits are spent. To turn Netlify back on, delete this line.
  ignore = "exit 0"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: any path that isn't a file or function serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' https://challenges.cloudflare.com https://cloudflareinsights.com https://static.cloudflareinsights.com; frame-src https://challenges.cloudflare.com; worker-src 'self'; manifest-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# /api responses get Cache-Control: no-store from netlify/functions/api.ts itself
# ([[headers]] rules don't apply to function responses).

[[edge_functions]]
  function = "seo_headers"
  path = "/*"
